name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is absent because the package manager itself requires Node
        # 22.13 or later, not because the packages do. Testing on a
        # toolchain nobody runs would be testing something else.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # No version pin: the action reads packageManager from package.json,
      # so continuous integration cannot drift from the local toolchain. A
      # hardcoded 9 could not read overrides from pnpm-workspace.yaml, which
      # is a pnpm 10 feature, and every install failed on a config mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: typechecking resolves against emitted declarations,
      # which a fresh checkout does not have.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The committed bundles are the distribution: neither package is on a
      # registry, so cloning and pointing a client at the .mjs is the only way
      # anyone runs these servers. A bundle that drifts from source is what
      # every user gets, silently. The frozen lockfile is what makes this
      # comparison meaningful; without it a transitive dependency bump alone
      # produces a diff.
      - name: Bundles match source
        if: matrix.node == 22
        run: |
          pnpm bundle
          if ! git diff --exit-code -- csis-server.mjs frame-language-server.mjs; then
            echo ""
            echo "The committed bundles do not match the current source."
            echo "Run 'pnpm bundle' and commit the result."
            exit 1
          fi
