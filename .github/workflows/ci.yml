name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the packages target. 22 is where import attributes
        # became mandatory for JSON modules, which is the version that caught a
        # broken package entry point that every other check reported as green.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # The committed bundles are the distribution: neither package is on a
      # registry, so cloning and pointing a client at the .mjs is the only way
      # anyone runs these servers. A bundle that drifts from source is what
      # every user gets, silently. The frozen lockfile is what makes this
      # comparison meaningful; without it a transitive dependency bump alone
      # produces a diff.
      - name: Bundles match source
        if: matrix.node == 20
        run: |
          pnpm bundle
          if ! git diff --exit-code -- csis-server.mjs frame-language-server.mjs; then
            echo ""
            echo "The committed bundles do not match the current source."
            echo "Run 'pnpm bundle' and commit the result."
            exit 1
          fi
